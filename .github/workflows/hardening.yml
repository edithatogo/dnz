name: Contract, Security, and Packaging Hardening

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
    inputs:
      live_smoke:
        description: Run the low-volume read-only DigitalNZ smoke test
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-surface:
    name: Rust format, lint, and workspace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo bench -p dnz-core --bench benchmarks

  mutation-slice:
    name: Bounded mutation slice
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2
        with:
          tool: cargo-mutants
      - name: Run bounded mutation slice
        run: >-
          cargo mutants --workspace
          --file crates/dnz-core/src/errors.rs
          --timeout 60
          --jobs 1

  msrv:
    name: MSRV workspace check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e43eeffd51aefeea929f4ea14e09fd077153e788 # 1.94
      - run: cargo check --workspace --all-features

  adapters-and-packages:
    name: Python, MCP, and package metadata checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: prefix-dev/setup-pixi@ba3bb36eb2066252b2363392b7739741bb777659 # v0.8.1
        with:
          pixi-version: latest
      - run: pixi install --locked
      - run: cargo test -p dnz-mcp --all-features
      - run: cargo check -p dnz-python --all-features
      - run: python -m unittest discover -s crates/dnz-python/python/tests -v
      - name: Validate package metadata
        shell: pwsh
        run: ./scripts/validate-package-metadata.ps1 -AllowDirty

  contract:
    name: Offline OpenAPI drift report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/check_openapi_drift.py --report openapi-drift.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openapi-drift-report
          path: openapi-drift.json

  registry-metadata:
    name: Offline registry metadata validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate registry metadata
        run: python scripts/validate-registry-metadata.py

  workflow-policy:
    name: Offline workflow policy validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install workflow policy validator dependency
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.2"
      - name: Validate workflow policy
        run: python scripts/validate-workflow-policy.py --strict

  live-smoke:
    name: Opt-in DigitalNZ live smoke
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_smoke }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Run read-only smoke request
        shell: pwsh
        env:
          DIGITALNZ_API_KEY: ${{ secrets.DIGITALNZ_API_KEY }}
        run: ./scripts/live-digitalnz-smoke.ps1 -RunLive

  security:
    name: Audit, licenses, secrets, and SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2
        with:
          tool: cargo-audit
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2
        with:
          tool: cargo-deny
      - run: cargo audit
      - run: cargo deny check
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dnz.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dnz-sbom
          path: dnz.spdx.json

  container:
    name: Optional CLI container smoke build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build container without publishing
        run: docker build --tag dnz:ci .
