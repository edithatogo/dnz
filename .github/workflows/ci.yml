name: Rust CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Code Quality & Test Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'

      - name: Validate Python 3.14-only policy
        run: python scripts/check_python_runtime_policy.py

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Dependencies
        uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Verify Formatting
        run: cargo fmt --all -- --check

      - name: Run Linter (Clippy)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --all-features

      - name: Install Cargo Audit
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2
        with:
          tool: cargo-audit

      - name: Run Dependency Audit
        run: cargo audit

      - name: Validate TMDL Scaffold
        shell: pwsh
        run: ./scripts/validate-tmdl.ps1

      - name: Validate Package Metadata
        shell: pwsh
        run: ./scripts/validate-package-metadata.ps1

      - name: Validate Conductor Learning Log
        run: python scripts/validate_learning_log.py

      - name: Validate zero-cost RNZ archive policy
        run: python scripts/rnz_archive.py policy

      - name: Run offline RNZ archive tests
        run: python -m unittest tests.test_python_runtime_policy tests.test_rnz_archive

      - name: Install Cargo LLVM Cov
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2
        with:
          tool: cargo-llvm-cov

      - name: Run Tests & Measure Coverage
        shell: pwsh
        run: ./scripts/coverage.ps1
