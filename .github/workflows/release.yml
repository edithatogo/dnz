name: CD Release Pipeline

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            asset_name: dnz-linux-x86_64
            mcp_asset_name: dnz-mcp-linux-x86_64
          - os: windows-latest
            asset_name: dnz-windows-x86_64.exe
            mcp_asset_name: dnz-mcp-windows-x86_64.exe
          - os: macos-latest
            asset_name: dnz-macos-x86_64
            mcp_asset_name: dnz-mcp-macos-x86_64

    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Set up Python for archive verification
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Cache Cargo Dependencies
        uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Compile Release Binaries
        run: cargo build --release -p dnz-cli -p dnz-mcp

      - name: Rename Artifacts
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv target/release/dnz-cli.exe target/release/${{ matrix.asset_name }}
            mv target/release/dnz-mcp.exe target/release/${{ matrix.mcp_asset_name }}
          else
            mv target/release/dnz-cli target/release/${{ matrix.asset_name }}
            mv target/release/dnz-mcp target/release/${{ matrix.mcp_asset_name }}
          fi

      - name: Upload Release Assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            target/release/${{ matrix.asset_name }}
            target/release/${{ matrix.mcp_asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create verified release archive
        shell: bash
        run: |
          python scripts/create-release-archive.py \
            --archive "dist/dnz-${{ matrix.os }}.zip" \
            --files "target/release/${{ matrix.asset_name }}" "target/release/${{ matrix.mcp_asset_name }}"

      - name: Upload verified release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dnz-release-${{ matrix.os }}
          path: dist/dnz-${{ matrix.os }}.zip

  publish-cargo:
    name: Package crates.io dry-runs
    runs-on: ubuntu-latest
    needs: [release]
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Cargo Dependencies
        uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Validate crates.io secret mapping
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN is available to the release workflow."
          else
            echo "CARGO_REGISTRY_TOKEN is not configured or unavailable in this context."
          fi

      - name: Dry-run Cargo package publication
        shell: pwsh
        run: ./scripts/verify-cargo-publish-dryruns.ps1

  publish-pypi:
    name: Build Python package
    runs-on: ubuntu-latest
    needs: [release]
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'

      - name: Install Maturin
        run: pip install maturin twine

      - name: Build Python Wheel
        run: maturin build --release --manifest-path crates/dnz-python/Cargo.toml

      - name: Check Python Wheel Metadata
        run: python -m twine check target/wheels/*

      - name: Validate PyPI secret mapping
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        shell: bash
        run: |
          if [ -n "$MATURIN_PYPI_TOKEN" ]; then
            echo "PYPI_API_TOKEN is available to the release workflow."
          else
            echo "PYPI_API_TOKEN is not configured or unavailable in this context."
          fi
